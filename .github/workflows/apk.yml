name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create logo file from logo.png
        run: |
          test -f logo.png || { echo "logo.png not found in repository root"; exit 1; }
          cp logo.png app-logo.png
          sha256sum logo.png app-logo.png
      - name: Prepare web files
        run: |
          mkdir www
          cp index.html style.css app.js store.js manifest.json sw.js www/
          cp icon-v6-*.png www/ || true
      - name: Install Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/share@6
          npx cap init "Rasa used phone" com.rasa.usedphone --web-dir www
          npx cap add android
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">Rasa used phone</string>#; s#<string name="title_activity_main">.*</string>#<string name="title_activity_main">Rasa used phone</string>#' android/app/src/main/res/values/strings.xml
      - name: App icon from app-logo.png
        run: |
          pip install pillow
          RES=android/app/src/main/res
          find $RES -name 'ic_launcher*' ! -name '*.xml' -delete
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          res = 'android/app/src/main/res'
          src = Image.open('app-logo.png').convert('RGBA')
          dens = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          for n, (s, f) in dens.items():
              d = f'{res}/mipmap-{n}'
              os.makedirs(d, exist_ok=True)
              src.resize((s, s), Image.LANCZOS).convert('RGB').save(f'{d}/ic_launcher.png')
              big = src.resize((s * 4, s * 4), Image.LANCZOS)
              m = Image.new('L', (s * 4, s * 4), 0)
              ImageDraw.Draw(m).ellipse([0, 0, s * 4 - 1, s * 4 - 1], fill=255)
              r = Image.new('RGBA', (s * 4, s * 4), (0, 0, 0, 0))
              r.paste(big, (0, 0), m)
              r.resize((s, s), Image.LANCZOS).save(f'{d}/ic_launcher_round.png')
              inner = int(f * 0.70)
              fg = Image.new('RGBA', (f, f), (0, 0, 0, 0))
              fg.alpha_composite(src.resize((inner, inner), Image.LANCZOS), ((f - inner) // 2, (f - inner) // 2))
              fg.save(f'{d}/rasa_foreground.png')
          os.makedirs(f'{res}/mipmap-anydpi-v26', exist_ok=True)
          os.makedirs(f'{res}/values', exist_ok=True)
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/rasa_icon_bg"/>\n    <foreground android:drawable="@mipmap/rasa_foreground"/>\n</adaptive-icon>\n'
          open(f'{res}/mipmap-anydpi-v26/ic_launcher.xml', 'w').write(xml)
          open(f'{res}/mipmap-anydpi-v26/ic_launcher_round.xml', 'w').write(xml)
          open(f'{res}/values/rasa_colors.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="rasa_icon_bg">#FFFFFF</color>\n</resources>\n')
          PY
          ls -la $RES/mipmap-xxxhdpi
      - name: Fixed signing key (same key for every build)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
      - name: Build APK
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rasa-used-phone-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
